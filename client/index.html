    <style id="seo-snapshot-critical">
      html, body { min-height: 100%; background: #0a1830; }
      body { margin: 0; }
      .seo-snapshot {
        position: relative; isolation: isolate; display: grid; min-height: 100vh; min-height: 100svh;
        place-items: center; overflow: hidden; box-sizing: border-box;
        padding: clamp(42px, 8vw, 92px) clamp(22px, 6vw, 72px); color: #f7f9ff;
        background-image: linear-gradient(rgba(157,178,223,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(157,178,223,.045) 1px, transparent 1px),
          radial-gradient(ellipse at 82% 14%, rgba(130,156,255,.2), transparent 38%),
          radial-gradient(ellipse at 12% 88%, rgba(24,182,165,.13), transparent 40%),
          linear-gradient(140deg, #0e213f, #09172d);
        background-size: 72px 72px, 72px 72px, auto, auto, auto;
        font-family: "Montserrat", Arial, sans-serif;
      }
      .seo-snapshot::before {
        position: absolute; z-index: -1; top: -180px; right: -90px; width: min(54vw, 620px);
        height: min(54vw, 620px); border: 1px solid rgba(166,188,255,.14); border-radius: 50%;
        box-shadow: 0 0 0 28px rgba(130,156,255,.035), 0 0 0 58px rgba(24,182,165,.025); content: "";
      }
      .seo-snapshot__inner {
        position: relative; z-index: 1; width: min(930px, 100%); padding: clamp(28px, 6vw, 66px);
        border: 1px solid rgba(167,190,255,.2); border-radius: 23px;
        background: linear-gradient(148deg, rgba(21,46,81,.78), rgba(8,22,43,.72));
        box-shadow: 0 28px 90px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
        backdrop-filter: blur(9px);
      }
      .seo-snapshot__eyebrow {
        display: inline-flex; align-items: center; gap: 9px; margin: 0; padding: 8px 11px;
        border: 1px solid rgba(183,207,230,.16); border-radius: 99px; background: rgba(255,255,255,.045);
        color: #c5d5ed; font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
      }
      .seo-snapshot__eyebrow::before {
        width: 8px; height: 8px; border-radius: 50%; background: #18b6a5;
        box-shadow: 0 0 0 5px rgba(24,182,165,.12); content: "";
      }
      .seo-snapshot h1 {
        max-width: 850px; margin: 22px 0 16px; color: #fff;
        font-family: "Sora", "Arial", sans-serif; font-size: clamp(39px, 6.3vw, 69px);
        font-weight: 600; line-height: 1.08; letter-spacing: -.065em;
      }
      .seo-snapshot__inner > p:not(.seo-snapshot__eyebrow) {
        max-width: 700px; margin: 0; color: rgba(247,249,255,.92); font-size: clamp(16px, 1.25vw, 18px); line-height: 1.8;
      }
      .seo-snapshot__inner > a {
        display: inline-flex; min-height: 48px; align-items: center; justify-content: center; margin-top: 24px;
        padding: 13px 19px; border-radius: 12px; background: linear-gradient(112deg, #91a6ff, #6f89f3 55%, #2ab6b2);
        box-shadow: 0 12px 30px rgba(83,116,224,.25); color: #071731; font-family: "Sora", "Arial", sans-serif;
        font-size: 14px; font-weight: 700; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease;
      }
      .seo-snapshot__inner > a:hover { transform: translateY(-2px); box-shadow: 0 16px 38px rgba(83,116,224,.34); }
      .seo-snapshot__inner > a:focus-visible { outline: 3px solid #18b6a5; outline-offset: 4px; }
      html[data-app-ready="true"] .seo-snapshot { display: none; }
      @media (max-width: 680px) {
        .seo-snapshot { padding: 34px 18px; }
        .seo-snapshot__inner { padding: 27px 22px; border-radius: 19px; }
        .seo-snapshot h1 { margin-top: 19px; font-size: clamp(37px, 10vw, 52px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .seo-snapshot__inner > a { transition: none; }
        .seo-snapshot__inner > a:hover { transform: none; }
      }
    </style>
  </head>
